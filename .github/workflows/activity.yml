name: Update README with Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: jamesgeorge007/github-activity-readme@v0.3.4
        with:
          COMMIT_MSG: "Updated GitHub activity"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
